# Baseline Minervini VCP configuration — textbook defaults from docs/VCP_RESEARCH.md
name: base

universe:
  min_price: 5.0
  min_dollar_volume: 2000000
  min_history_days: 260

tt:
  min_pct_above_52w_low: 0.30
  max_pct_below_52w_high: 0.25
  rs_percentile_min: 70.0
  sma200_slope_days: 21

vcp:
  swing_window: 3
  min_contractions: 2
  max_contractions: 6
  contraction_ratio_max: 0.75
  base_max_depth: 0.35
  final_depth_max: 0.10
  base_min_days: 25
  base_max_days: 325
  pivot_max_below_base_high: 0.10
  vdu_ratio_max: 0.85
  setup_max_active_days: 40

entry:
  breakout_buffer: 0.002
  max_chase_pct: 0.05
  bo_vol_mult: 0.0
  market_filter: true
  market_filter_ma: 200

risk:
  stop_pct: 0.06
  stop_use_contraction_low: true
  stop_max_pct: 0.10
  risk_per_trade: 0.01
  max_positions: 8
  max_weight: 0.20

exit:
  target_R: 3.0
  breakeven_at_R: 1.0
  trail_ma: 50
  time_stop_days: 0

costs:
  slippage_bps: 10.0
  commission_bps: 2.0

backtest:
  start: "2004-01-01"
  end: "2026-08-01"
  initial_capital: 100000
